name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            config: Release
            sanitizer: ""
          - name: asan
            config: Debug
            sanitizer: address
          - name: tsan
            config: Debug
            sanitizer: thread
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y g++ cmake pkg-config
      - name: configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DKESTREL_SANITIZER=${{ matrix.sanitizer }}
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure
